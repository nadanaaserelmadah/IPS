# Joint encoder + fusion on raw KITTI (ablation vs frozen-latent VIFT recipe).
_target_: src.models.euroc_joint_module.EurocJointLitModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.01

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  _partial_: true
  T_0: 25
  T_mult: 1

criterion:
  _target_: src.metrics.weighted_loss.AngleWeightedPoseLoss
  base_loss_fn:
    _target_: torch.nn.L1Loss
    reduction: none
  angle_weight: 10

net:
  _target_: src.models.components.euroc_joint_net.EurocJointNet
  img_w: 512
  img_h: 256
  v_f_len: 512
  i_f_len: 256
  imu_dropout: 0.1

pretrained_encoder: ${paths.root_dir}/pretrained_models/vf_512_if_256_3e-05.model
# Optional: warm-start fusion from frozen KITTI latent checkpoint (state_dict net.*).
phase2_ckpt: null
fusion_lr: 0.0001
freeze_encoder_epochs: 5
# Keep warm-started fusion fixed while probing encoder fine-tune (set high, e.g. 999).
freeze_fusion_epochs: 0
encoder_heads_only: false
encoder_lr_scale: 0.1
gradient_clip_val: 1.0

metrics_calculator:
  _target_: src.metrics.kitti_metrics_calculator.KITTIMetricsCalculator

tester:
  _target_: src.testers.kitti_joint_tester.KittiJointTester
  val_seqs: ["05", "07", "10"]
  data_dir: ${paths.data_dir}/kitti_data
  seq_len: 11
  folder: sequences
  img_w: 512
  img_h: 256
  device: cuda
  use_history_in_eval: true
  eval_mode: streaming_history

compile: false

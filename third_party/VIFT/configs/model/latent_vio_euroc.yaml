# Fusion transformer + EuRoC latent tester (ATE in meters).
_target_: src.models.weighted_vio_module.WeightedVIOLitModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  _partial_: true
  T_0: 25
  T_mult: 1

criterion:
  _target_: src.metrics.weighted_loss.AngleWeightedPoseLoss
  base_loss_fn:
    _target_: torch.nn.L1Loss
    reduction: none
  angle_weight: 10

net:
  _target_: src.models.components.pose_transformer.PoseTransformer
  input_dim: 768
  embedding_dim: 768
  num_layers: 4
  nhead: 6
  dim_feedforward: 128
  dropout: 0.0

metrics_calculator:
  _target_: src.metrics.euroc_metrics_calculator.EuroCMetricsCalculator

tester:
  _target_: src.testers.euroc_latent_tester.EuroCLatentTester
  sequences:
    - MH_05_difficult
    - V2_02_medium
  data_dir: ${paths.data_dir}/euroc
  seq_len: 11
  cam_stride: 2
  imu_freq: 10
  img_w: 512
  img_h: 256
  wrapper_weights_path: ${paths.root_dir}/pretrained_models/vf_512_if_256_3e-05.model
  device: cuda
  v_f_len: 512
  i_f_len: 256
  use_history_in_eval: true

compile: false

# Phase 4: TUM-VI joint fine-tune / zero-shot eval (EuRoC-trained ckpt).
_target_: src.models.euroc_joint_module.EurocJointLitModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.01

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  _partial_: true
  T_0: 25
  T_mult: 1

criterion:
  _target_: src.metrics.weighted_loss.AngleWeightedPoseLoss
  base_loss_fn:
    _target_: torch.nn.L1Loss
    reduction: none
  angle_weight: 10

net:
  _target_: src.models.components.euroc_joint_net.EurocJointNet
  img_w: 512
  img_h: 256
  v_f_len: 512
  i_f_len: 256
  imu_dropout: 0.1

pretrained_encoder: ${paths.root_dir}/pretrained_models/vf_512_if_256_3e-05.model
phase2_ckpt: null
fusion_lr: 0.0001
freeze_encoder_epochs: 5
encoder_lr_scale: 0.1

metrics_calculator:
  _target_: src.metrics.euroc_metrics_calculator.EuroCMetricsCalculator

tester:
  _target_: src.testers.tum_vi_joint_tester.TumViJointTester
  sequences:
    - dataset-magistrale1_512_16
    - dataset-slides1_512_16
  data_dir: ${paths.data_dir}/tum_vi
  seq_len: 11
  cam_stride: 2
  imu_freq: 10
  img_w: 512
  img_h: 256
  wrapper_weights_path: ""
  device: cuda
  v_f_len: 512
  i_f_len: 256
  use_history_in_eval: false

compile: false

# EuRoC raw loader — Phase 5 leakage-free split.
# Train: non-held-out sequences (excludes MH_05, V2_02, V2_03).
# Val: V1_03 only (model selection).
# Test: placeholder during train; real ATE via tester / eval scripts on MH_05 + V2_02.
_target_: src.data.vio_datamodule.VIODataModule
batch_size: 4
num_workers: 0
pin_memory: False
train_loader:
  _target_: src.data.components.EuRoC_dataset.EuRoC
  _partial_: false
  root: ${paths.data_dir}/euroc
  sequences:
    - MH_01_easy
    - MH_02_easy
    - MH_03_medium
    - MH_04_difficult
    - V2_01_easy
  sequence_length: 11
  cam_stride: 2
  imu_freq: 10
  transform:
    _target_: src.utils.custom_transform.Compose
    _partial_: false
    transforms:
      - _target_: src.utils.custom_transform.ToTensor
      - _target_: src.utils.custom_transform.Resize
        size: [256, 512]
val_loader:
  _target_: src.data.components.EuRoC_dataset.EuRoC
  _partial_: false
  root: ${paths.data_dir}/euroc
  sequences:
    - V1_03_difficult
  sequence_length: 11
  cam_stride: 2
  imu_freq: 10
  transform:
    _target_: src.utils.custom_transform.Compose
    _partial_: false
    transforms:
      - _target_: src.utils.custom_transform.ToTensor
      - _target_: src.utils.custom_transform.Resize
        size: [256, 512]
test_loader:
  _target_: src.data.components.empty_dataset.EvalPlaceholderDataset

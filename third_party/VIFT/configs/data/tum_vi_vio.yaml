# TUM-VI raw loader — 512_16 subset splits (skip missing on partial mirrors).
_target_: src.data.vio_datamodule.VIODataModule
batch_size: 4
num_workers: 0
pin_memory: False
train_loader:
  _target_: src.data.components.TUMVI_dataset.TUMVI
  _partial_: false
  root: ${paths.data_dir}/tum_vi
  sequences:
    - dataset-room1_512_16
    - dataset-room2_512_16
    - dataset-corridor1_512_16
  sequence_length: 11
  cam_stride: 2
  imu_freq: 10
  transform:
    _target_: src.utils.custom_transform.Compose
    _partial_: false
    transforms:
      - _target_: src.utils.custom_transform.ToTensor
      - _target_: src.utils.custom_transform.Resize
        size: [256, 512]
val_loader:
  _target_: src.data.components.TUMVI_dataset.TUMVI
  _partial_: false
  root: ${paths.data_dir}/tum_vi
  sequences:
    - dataset-corridor2_512_16
    - dataset-room3_512_16
  sequence_length: 11
  cam_stride: 2
  imu_freq: 10
  transform:
    _target_: src.utils.custom_transform.Compose
    _partial_: false
    transforms:
      - _target_: src.utils.custom_transform.ToTensor
      - _target_: src.utils.custom_transform.Resize
        size: [256, 512]
test_loader:
  _target_: src.data.components.TUMVI_dataset.TUMVI
  _partial_: false
  root: ${paths.data_dir}/tum_vi
  sequences:
    - dataset-magistrale1_512_16
    - dataset-slides1_512_16
  sequence_length: 11
  cam_stride: 2
  imu_freq: 10
  transform:
    _target_: src.utils.custom_transform.Compose
    _partial_: false
    transforms:
      - _target_: src.utils.custom_transform.ToTensor
      - _target_: src.utils.custom_transform.Resize
        size: [256, 512]

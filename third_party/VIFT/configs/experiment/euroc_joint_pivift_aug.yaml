# @package _global_
# PI-VIFT + augmentation and regularization (E2): photometric + IMU bias/noise jitter,
# fusion dropout 0.1, weight decay 0.05. Otherwise identical to euroc_joint_pivift.
#
#   python src/train.py experiment=euroc_joint_pivift_aug trainer=gpu train=true test=false

defaults:
  - override /data: euroc_vio_pivift_aug
  - override /model: euroc_joint_pivift
  - override /callbacks: phase2_checkpoint
  - override /trainer: default

tags: ["euroc_joint_pivift_aug", "pi_vift", "g1", "aug"]

seed: 42

train: true
test: false

trainer:
  min_epochs: 1
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 10
  num_sanity_val_steps: 0
  gradient_clip_val: 1.0

data:
  batch_size: 4

model:
  phase2_ckpt: null
  freeze_encoder_epochs: 100
  fusion_lr: 0.0001
  encoder_lr_scale: 0.1
  optimizer:
    weight_decay: 0.05
  net:
    dropout: 0.1
  gradient_clip_val: 1.0

# @package _global_
# Frozen-encoder KITTI recipe closer to VIFT Table 1 (w. RPMG):
# - RPMG rotation loss (angle_weight 40)
# - longer latent windows (train_64 / eval seq_len 65)
#
# python src/train.py experiment=latent_kitti_rpmg_long trainer=gpu trainer.max_epochs=200

defaults:
  - override /data: latent_kitti_vio
  - override /model: latent_vio_tf
  - override /callbacks: default
  - override /trainer: default

tags: ["latent_kitti_vio", "rpmg", "long_window", "transformer"]

seed: 42

trainer:
  min_epochs: 20
  max_epochs: 200
  log_every_n_steps: 1

data:
  batch_size: 128
  train_loader:
    root_dir: ${paths.data_dir}/kitti_latent_data/train_64
  val_loader:
    root_dir: ${paths.data_dir}/kitti_latent_data/val_64
  test_loader:
    root_dir: ${paths.data_dir}/kitti_latent_data/val_64

model:
  _target_: src.models.weighted_vio_module.WeightedVIOLitModule

  optimizer:
    lr: 0.0001

  criterion:
    _target_: src.metrics.weighted_loss.RPMGPoseLoss
    base_loss_fn:
      _target_: torch.nn.L1Loss
      reduction: none
    angle_weight: 40

  scheduler:
    T_0: 25
    T_mult: 1

  tester:
    seq_len: 65
    use_history_in_eval: true

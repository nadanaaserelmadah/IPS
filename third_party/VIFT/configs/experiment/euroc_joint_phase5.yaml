# @package _global_
# Phase 5: EuRoC frontend refresh from TUM-FT with geometric multi-horizon loss.
#
#   python src/train.py experiment=euroc_joint_phase5 trainer=gpu train=true test=false \
#     init_ckpt_weights=true "ckpt_path=/path/to/tum_ft_epoch_024.ckpt"
#
# Or via scripts/phase5/run_phase5.py

defaults:
  - override /data: euroc_vio_phase5
  - override /model: euroc_joint_phase5
  - override /callbacks: phase2_checkpoint
  - override /trainer: default

tags: ["euroc_joint_phase5", "phase5"]

seed: 42

train: true
test: false

# Warm-start weights only (epoch 0, fresh optimizer) when loading TUM-FT / external ckpt.
init_ckpt_weights: false
ckpt_path: null

trainer:
  min_epochs: 1
  max_epochs: 100
  accelerator: gpu
  devices: 1
  log_every_n_steps: 10
  num_sanity_val_steps: 0
  gradient_clip_val: 1.0

data:
  batch_size: 4

model:
  phase2_ckpt: null
  freeze_encoder_epochs: 3
  fusion_lr: 0.00005
  encoder_lr_scale: 0.1
  gradient_clip_val: 1.0
  scheduler:
    T_0: 50

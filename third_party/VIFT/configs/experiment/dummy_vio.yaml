# @package _global_
# Smoke test — no KITTI.
# python src/train.py experiment=dummy_vio trainer=gpu trainer.max_epochs=2 test=false

defaults:
  - override /data: dummy_vio
  - override /model: vio_dummy
  - override /callbacks: none
  - override /trainer: default

tags: ["dummy_vio"]
seed: 12345

trainer:
  min_epochs: 1
  max_epochs: 5

data:
  batch_size: 2
  train_loader:
    seq_len: 5
    channels: 1
    width: 64
    height: 32
    imu_freq: 5
    dataset_size: 100
  val_loader:
    seq_len: 5
    channels: 1
    width: 64
    height: 32
    imu_freq: 5
    dataset_size: 20
  test_loader:
    seq_len: 5
    channels: 1
    width: 64
    height: 32
    imu_freq: 5
    dataset_size: 20

test: false

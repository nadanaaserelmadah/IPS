# @package _global_
# EuRoC Phase 1: latent cache + short fusion train + ATE test.
#
#   python src/train.py experiment=euroc_latent_minimal trainer=gpu
#
# Prereqs: data/euroc/<seq>/, pretrained encoder, euroc_latent_data/{train,val}

defaults:
  - override /data: latent_euroc_vio
  - override /model: latent_vio_euroc
  - override /callbacks: default
  - override /trainer: default

tags: ["euroc_latent_minimal"]

seed: 42

train: true
test: true

trainer:
  min_epochs: 1
  max_epochs: 5
  accelerator: gpu
  devices: 1
  log_every_n_steps: 5
  num_sanity_val_steps: 0

data:
  batch_size: 32

model:
  optimizer:
    lr: 0.0001
  scheduler:
    T_0: 5
    T_mult: 1
  tester:
    sequences:
      - MH_05_difficult
      - V2_02_medium
